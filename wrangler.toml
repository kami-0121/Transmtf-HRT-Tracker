# Cloudflare Workers deployment of this fork.
# `name` must match the Worker you create in the Cloudflare dashboard
# (Workers & Pages → Create → Import a repository).
name = "transmtf-hrt-tracker"
main = "worker.ts"
compatibility_date = "2025-12-04"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker must run first for HTML pages: it injects window.__ENV__
# (CLOUD_ENABLED / API URL / Turnstile key). With only "/api/*" the HTML was
# served straight from assets and the injection never happened.
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Local-only mode: no accounts / cloud sync, nothing leaves the browser.
# To enable cloud features, point to YOUR OWN backend (see docs/api.md) and
# Turnstile site key, then set CLOUD_ENABLED = "true":
#   VITE_API_BASE_URL = "https://your-backend.example.com/api"
#   VITE_TURNSTILE_SITE_KEY = "your-turnstile-site-key"
CLOUD_ENABLED = "false"
